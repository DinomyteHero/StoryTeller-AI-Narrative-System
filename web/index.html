<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storyteller V3</title>
<style>
/* ── Reset & Base ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0d0f14;
  --surface:     #161a23;
  --surface-alt: #1c2130;
  --border:      #2a3040;
  --text:        #d8dce6;
  --text-dim:    #8890a0;
  --accent:      #c8a84e;
  --accent-dim:  #a0883e;
  --danger:      #c44;
  --success:     #4a4;

  /* FFG dice colors */
  --die-yellow:  #edd400;
  --die-green:   #4e9a06;
  --die-red:     #cc0000;
  --die-purple:  #75507b;
  --die-blue:    #3465a4;
  --die-black:   #2e3436;
  --die-white:   #eeeeec;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Georgia, 'Times New Roman', serif;
  line-height: 1.7;
  min-height: 100vh;
}

/* ── Layout ────────────────────────────────────────────────────── */
.container {
  max-width: 650px;
  margin: 0 auto;
  padding: 1rem;
}

/* ── Header ────────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}

.campaign-name {
  font-size: 1.1rem;
  font-weight: bold;
  color: var(--accent);
  letter-spacing: 0.04em;
}

.session-info {
  font-size: 0.8rem;
  color: var(--text-dim);
  font-family: monospace;
}

/* ── Local narration warning ───────────────────────────────────── */
.local-warning {
  display: none;
  background: #2a2010;
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  padding: 0.5rem 0.75rem;
  border-radius: 4px;
  font-size: 0.85rem;
  margin-bottom: 1rem;
  font-family: sans-serif;
}

.local-warning.visible { display: block; }

/* ── Prose passage ─────────────────────────────────────────────── */
.passage {
  background: var(--surface);
  border-radius: 6px;
  padding: 1.5rem;
  margin-bottom: 1rem;
  min-height: 200px;
  white-space: pre-wrap;
  font-size: 1.05rem;
}

.passage p { margin-bottom: 0.8em; }
.passage p:last-child { margin-bottom: 0; }

/* ── Dice panel ────────────────────────────────────────────────── */
.dice-panel {
  display: none;
  margin-bottom: 1rem;
}

.dice-panel.visible { display: block; }

.dice-toggle {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--accent);
  padding: 0.5rem 0.75rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.9rem;
  font-family: sans-serif;
  width: 100%;
  text-align: left;
}

.dice-toggle:hover { background: var(--surface); }

.dice-details {
  display: none;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 4px 4px;
  padding: 1rem;
  font-family: monospace;
  font-size: 0.85rem;
  line-height: 1.5;
}

.dice-details.expanded { display: block; }

.dice-pool-display {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 0.75rem;
}

.die-chip {
  display: inline-block;
  padding: 0.2rem 0.5rem;
  border-radius: 3px;
  font-weight: bold;
  font-size: 0.8rem;
  color: #000;
}

.die-chip.yellow  { background: var(--die-yellow); }
.die-chip.green   { background: var(--die-green); color: #fff; }
.die-chip.red     { background: var(--die-red); color: #fff; }
.die-chip.purple  { background: var(--die-purple); color: #fff; }
.die-chip.blue    { background: var(--die-blue); color: #fff; }
.die-chip.black   { background: var(--die-black); color: #fff; }
.die-chip.white   { background: var(--die-white); color: #000; }

.roll-summary {
  color: var(--text);
  font-weight: bold;
  margin-top: 0.5rem;
}

/* ── Choices ───────────────────────────────────────────────────── */
.choices {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  margin-bottom: 2rem;
}

.choice-btn {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.75rem 1rem;
  border-radius: 4px;
  cursor: pointer;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 0.95rem;
  text-align: left;
  min-height: 44px;
  transition: background 0.15s, border-color 0.15s;
}

.choice-btn:hover:not(:disabled) {
  background: var(--surface);
  border-color: var(--accent-dim);
}

.choice-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.choice-btn.selected {
  border-color: var(--accent);
  background: #1a1f2e;
}

/* ── Free-form input ───────────────────────────────────────────── */
.freeform-wrapper {
  margin-top: 0.5rem;
}

.freeform-details summary {
  cursor: pointer;
  color: var(--text-dim);
  font-size: 0.85rem;
  padding: 0.5rem 0.25rem;
  user-select: none;
}

.freeform-details summary:hover {
  color: var(--accent-dim);
}

.freeform-details[open] summary {
  color: var(--accent);
  margin-bottom: 0.5rem;
}

.freeform-row {
  display: flex;
  gap: 0.5rem;
  align-items: stretch;
}

#freeform-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.6rem 0.8rem;
  border-radius: 4px;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 0.95rem;
  resize: vertical;
  min-height: 44px;
}

#freeform-input:focus {
  outline: none;
  border-color: var(--accent-dim);
}

.freeform-submit {
  flex: 0 0 auto;
  padding: 0.5rem 1rem;
  min-width: 80px;
  text-align: center;
}

.freeform-hint {
  margin-top: 0.4rem;
  font-size: 0.78rem;
  color: var(--text-dim);
  font-style: italic;
}

.freeform-hint kbd {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0 0.3rem;
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 0.75rem;
}

/* ── Destiny indicator ─────────────────────────────────────────── */
.destiny-indicator {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.25rem 0.6rem;
  border-radius: 999px;
  font-size: 0.8rem;
  margin-left: 0.5rem;
  border: 1px solid var(--border);
}

.destiny-indicator.light {
  color: #d8c878;
  border-color: #c8a84e;
  background: rgba(200, 168, 78, 0.1);
}

.destiny-indicator.dark {
  color: #c87878;
  border-color: #a04848;
  background: rgba(160, 72, 72, 0.1);
}

/* ── Loading / Status ──────────────────────────────────────────── */
.loading {
  display: none;
  text-align: center;
  padding: 2rem;
  color: var(--text-dim);
  font-style: italic;
}

.loading.visible { display: block; }

.spinner {
  display: inline-block;
  width: 1.5rem;
  height: 1.5rem;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 0.5rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── Start screen ──────────────────────────────────────────────── */
.start-screen {
  text-align: center;
  padding: 3rem 1rem;
}

.start-screen h1 {
  font-size: 1.8rem;
  color: var(--accent);
  margin-bottom: 0.5rem;
}

.start-screen p {
  color: var(--text-dim);
  margin-bottom: 2rem;
}

.start-btn {
  background: var(--accent-dim);
  color: #000;
  border: none;
  padding: 0.75rem 2rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: sans-serif;
  transition: background 0.15s;
}

.start-btn:hover { background: var(--accent); }
.start-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Status bar ────────────────────────────────────────────────── */
.status-bar {
  display: none;
  justify-content: space-between;
  font-family: monospace;
  font-size: 0.75rem;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
  padding-top: 0.5rem;
  margin-top: 1rem;
}

.status-bar.visible { display: flex; }

/* ── Error ─────────────────────────────────────────────────────── */
.error-msg {
  display: none;
  background: #2a1010;
  border: 1px solid var(--danger);
  color: #f88;
  padding: 0.75rem 1rem;
  border-radius: 4px;
  font-family: sans-serif;
  font-size: 0.85rem;
  margin-bottom: 1rem;
}

.error-msg.visible { display: block; }

/* ── Campaign picker ──────────────────────────────────────────── */
#campaign-picker button:hover {
  border-color: var(--accent-dim) !important;
  background: var(--border) !important;
}

/* ── Phase 25 §3.4 — Visual prose formatting ───────────────────── */
.passage em { font-style: italic; color: var(--text-dim); }
.passage strong { font-weight: bold; color: var(--accent); }
.passage hr.scene-break {
  border: none;
  border-top: 1px solid var(--border);
  margin: 1.2em auto;
  width: 30%;
  text-align: center;
}
.passage hr.scene-break::after {
  content: "* * *";
  display: inline-block;
  position: relative;
  top: -0.7em;
  background: var(--surface);
  padding: 0 0.6em;
  color: var(--text-dim);
  font-size: 0.8rem;
  letter-spacing: 0.4em;
}

/* Phase 25 §3.6 — Glossary tooltip terms in prose */
.passage .glossary-term {
  border-bottom: 1px dotted var(--accent-dim);
  cursor: help;
}

/* ── Phase 25 §2.2 — Visible cost tags + codex link styling ────── */
.choice-cost-tags {
  display: inline-block;
  margin-left: 0.4rem;
  font-family: monospace;
  font-size: 0.78rem;
  color: var(--text-dim);
  letter-spacing: 0.02em;
}

.choice-cost-tag {
  display: inline-block;
  padding: 0.1rem 0.4rem;
  border-radius: 3px;
  background: rgba(200, 168, 78, 0.08);
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  margin-right: 0.25rem;
}

.choice-cost-tag.morality-down {
  background: rgba(160, 72, 72, 0.08);
  border-color: #a04848;
  color: #d88;
}

.choice-btn.codex-link {
  font-style: italic;
  color: var(--text-dim);
  background: var(--surface);
  border-style: dashed;
  border-color: var(--border);
}
.choice-btn.codex-link::before {
  content: "📖 ";
  margin-right: 0.2rem;
}
.choice-btn.codex-link:hover:not(:disabled) {
  border-color: var(--accent-dim);
  color: var(--text);
}

/* ── Phase 25 §2.1 — Codex overlay ────────────────────────────── */
.codex-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.72);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.codex-overlay.visible { display: flex; }

.codex-panel {
  background: var(--surface);
  border: 1px solid var(--accent-dim);
  border-radius: 8px;
  padding: 1.5rem 1.75rem;
  max-width: 640px;
  width: 100%;
  max-height: 86vh;
  overflow-y: auto;
  font-family: Georgia, 'Times New Roman', serif;
  line-height: 1.7;
  font-size: 1rem;
}

.codex-panel .codex-tag {
  font-family: monospace;
  font-size: 0.8rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.3rem;
}

.codex-panel h2 {
  color: var(--text);
  font-size: 1.4rem;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.5rem;
}

.codex-panel .codex-body p { margin-bottom: 1rem; }

.codex-back-btn {
  display: inline-block;
  margin-top: 1.2rem;
  padding: 0.5rem 1rem;
  background: var(--surface-alt);
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  border-radius: 4px;
  font-family: sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
}
.codex-back-btn:hover { background: var(--surface); }

/* ── Phase 25 §3.5 — Dashboard ─────────────────────────────────── */
.dashboard-toggle-btn {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--accent);
  padding: 0.4rem 0.8rem;
  border-radius: 4px;
  cursor: pointer;
  font-family: sans-serif;
  font-size: 0.85rem;
}
.dashboard-toggle-btn:hover { background: var(--surface); }

.dashboard-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 999;
  padding: 1.5rem;
  overflow-y: auto;
}
.dashboard-overlay.visible { display: block; }

.dashboard-panel {
  max-width: 760px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--accent-dim);
  border-radius: 8px;
  padding: 1.25rem 1.5rem;
  font-family: Georgia, 'Times New Roman', serif;
}

.dashboard-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.6rem;
}

.dashboard-tab-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 0.35rem 0.7rem;
  border-radius: 4px;
  cursor: pointer;
  font-family: sans-serif;
  font-size: 0.82rem;
}
.dashboard-tab-btn.active {
  background: var(--surface-alt);
  color: var(--accent);
  border-color: var(--accent-dim);
}
.dashboard-tab-btn:hover:not(.active) {
  border-color: var(--accent-dim);
  color: var(--text);
}

.dashboard-section {
  display: none;
  font-size: 0.92rem;
  line-height: 1.55;
}
.dashboard-section.active { display: block; }

.dashboard-section h3 {
  color: var(--accent);
  font-size: 1rem;
  margin-bottom: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-family: sans-serif;
}

.axis-bar {
  position: relative;
  height: 18px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 9px;
  overflow: hidden;
  margin: 0.2rem 0 0.6rem 0;
}
.axis-bar-fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: linear-gradient(to right, var(--accent-dim), var(--accent));
  transition: width 0.3s ease;
}

.axis-row {
  display: grid;
  grid-template-columns: 1fr 60px 1fr;
  align-items: center;
  font-size: 0.83rem;
  margin-bottom: 0.7rem;
  gap: 0.5rem;
}
.axis-row .pole-label-left { text-align: right; color: var(--text-dim); }
.axis-row .pole-label-right { text-align: left; color: var(--text-dim); }
.axis-row .pole-label-active { color: var(--accent); font-weight: bold; }
.axis-row .axis-value { text-align: center; font-family: monospace; color: var(--text-dim); font-size: 0.78rem; }

.dashboard-section .axis-cue {
  font-style: italic;
  color: var(--text-dim);
  font-size: 0.78rem;
  padding-left: 0.5rem;
  border-left: 2px solid var(--border);
  margin-bottom: 0.7rem;
}

.relationship-slot {
  display: flex;
  justify-content: space-between;
  padding: 0.5rem 0.6rem;
  border-bottom: 1px solid var(--border);
  align-items: center;
  font-size: 0.88rem;
}
.relationship-slot.unknown { color: var(--text-dim); font-style: italic; }
.relationship-slot .disposition-bar {
  width: 80px;
  height: 6px;
  background: var(--surface-alt);
  border-radius: 3px;
  overflow: hidden;
}
.relationship-slot .disposition-bar > div {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s;
}

.codex-list-tag-group {
  margin-bottom: 0.8rem;
}
.codex-list-tag-group .codex-tag-label {
  color: var(--accent);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-family: sans-serif;
  margin-bottom: 0.3rem;
}
.codex-list-entry {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.4rem 0.7rem;
  border-radius: 3px;
  margin-bottom: 0.25rem;
  cursor: pointer;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 0.85rem;
}
.codex-list-entry.read { color: var(--text-dim); }
.codex-list-entry.unread::after {
  content: " · NEW";
  color: var(--accent);
  font-size: 0.7rem;
}

.achievement-row {
  padding: 0.5rem 0.6rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.86rem;
}
.achievement-row .ach-title {
  font-weight: bold;
  color: var(--accent);
}
.achievement-row.in-progress .ach-title { color: var(--text-dim); }
.achievement-row .ach-desc { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.2rem; }

/* ── Phase 25 §2.8 — Set-piece scene treatments ────────────────── */
.scene-title-card {
  background: linear-gradient(to right, transparent, rgba(200, 168, 78, 0.15), transparent);
  border-top: 2px solid var(--accent);
  border-bottom: 2px solid var(--accent);
  padding: 1.5rem 1rem;
  margin: 1.2rem 0;
  text-align: center;
  font-family: Georgia, 'Times New Roman', serif;
}
.scene-title-card .scene-title-label {
  color: var(--accent);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  margin-bottom: 0.4rem;
}
.scene-title-card .scene-title-text {
  color: var(--text);
  font-size: 1.5rem;
  font-weight: bold;
  letter-spacing: 0.04em;
}

.scene-break-marker {
  border-bottom: 1px solid var(--accent-dim);
  padding-bottom: 0.3rem;
  margin: 0.6rem 0 0.8rem 0;
}
.scene-break-marker .scene-title-text {
  color: var(--accent);
  font-weight: bold;
  font-size: 1.1rem;
  letter-spacing: 0.03em;
}

.scene-epigraph {
  font-style: italic;
  color: var(--text-dim);
  border-left: 2px solid var(--accent-dim);
  padding-left: 0.8rem;
  margin: 0.8rem 0 1rem 0;
  font-size: 0.9rem;
}

/* Phase 25 §2.10 — Stakes badge */
.stakes-badge {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 3px;
  font-size: 0.7rem;
  font-family: sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-weight: bold;
  margin-left: 0.5rem;
  vertical-align: middle;
}
.stakes-badge.high {
  background: rgba(200, 168, 78, 0.15);
  border: 1px solid var(--accent-dim);
  color: var(--accent);
}
.stakes-badge.critical {
  background: rgba(196, 64, 64, 0.18);
  border: 1px solid var(--danger);
  color: #f88;
}

/* Phase 25 §3.3 — Chapter / act title display */
.chapter-title {
  font-family: Georgia, 'Times New Roman', serif;
  color: var(--text-dim);
  font-size: 0.82rem;
  letter-spacing: 0.04em;
  text-align: center;
  margin: 0.5rem 0 1rem 0;
  padding: 0.4rem 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.chapter-title strong { color: var(--accent); font-weight: bold; }

/* Phase 25 §3.7 — Recap card for returning players */
.recap-card {
  background: rgba(200, 168, 78, 0.05);
  border: 1px solid var(--accent-dim);
  border-radius: 6px;
  padding: 1rem 1.2rem;
  margin-bottom: 1.2rem;
  font-size: 0.88rem;
  line-height: 1.5;
}
.recap-card .recap-label {
  color: var(--accent);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.4rem;
  font-family: sans-serif;
}
.recap-card details { margin-top: 0.4rem; }
.recap-card details summary { cursor: pointer; color: var(--text-dim); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="container">

  <!-- ── Start Screen ──────────────────────────────────────────── -->
  <div id="start-screen" class="start-screen">
    <h1>Storyteller V3</h1>
    <p>A Star Wars Narrative RPG</p>

    <div id="campaign-picker" style="margin-top:1.5rem; text-align:left;">
      <p style="color:var(--text-dim); font-size:0.9rem; text-align:center;">Loading campaigns...</p>
    </div>

    <button class="start-btn" id="start-btn" onclick="startSession()" disabled style="margin-top:1.5rem;">
      Select a campaign to begin
    </button>
  </div>

  <!-- ── Game Screen ───────────────────────────────────────────── -->
  <div id="game-screen" style="display:none">
    <header>
      <span class="campaign-name" id="campaign-name"></span>
      <span style="display:flex; gap:0.4rem; align-items:center;">
        <button class="dashboard-toggle-btn" id="dashboard-btn" onclick="openDashboard()">Dashboard</button>
        <span class="session-info" id="session-info"></span>
      </span>
    </header>

    <div class="local-warning" id="local-warning">
      Local narration — loop test only
    </div>

    <div class="error-msg" id="error-msg"></div>

    <!-- Phase 25 §3.3 — chapter / scene title shown above prose -->
    <div class="chapter-title" id="chapter-title" style="display:none"></div>

    <!-- Phase 25 §3.7 — recap card for sessions resumed after a break -->
    <div id="recap-mount"></div>

    <!-- Phase 25 §2.8 — set-piece title card (only shown for declared scenes) -->
    <div id="scene-treatment-mount"></div>

    <div class="passage" id="passage"></div>

    <div class="dice-panel" id="dice-panel">
      <button class="dice-toggle" id="dice-toggle" onclick="toggleDice()">
        Show dice result
      </button>
      <div class="dice-details" id="dice-details"></div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>The story unfolds...</div>
    </div>

    <div class="choices" id="choices"></div>

    <div class="status-bar" id="status-bar">
      <span id="status-turn">Turn 0</span>
      <span id="status-wounds"></span>
      <span id="status-strain"></span>
    </div>
  </div>

  <!-- Phase 25 §2.1 — codex overlay (sideways navigation) -->
  <div class="codex-overlay" id="codex-overlay" onclick="closeCodexIfBackdrop(event)">
    <div class="codex-panel" id="codex-panel">
      <div class="codex-tag" id="codex-entry-tag"></div>
      <h2 id="codex-entry-title"></h2>
      <div class="codex-body" id="codex-entry-body"></div>
      <button class="codex-back-btn" onclick="closeCodex()">Back to the story</button>
    </div>
  </div>

  <!-- Phase 25 §3.5 — dashboard overlay -->
  <div class="dashboard-overlay" id="dashboard-overlay">
    <div class="dashboard-panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
        <h2 style="color:var(--accent); font-size:1.2rem; letter-spacing:0.04em;">CHARACTER DASHBOARD</h2>
        <button class="codex-back-btn" onclick="closeDashboard()">Close</button>
      </div>
      <div class="dashboard-tabs" id="dashboard-tabs"></div>
      <div id="dashboard-body">
        <p style="text-align:center; color:var(--text-dim);">Loading...</p>
      </div>
    </div>
  </div>

</div>

<script>
/* ── State ─────────────────────────────────────────────────────── */
const API = '';  // same origin
let sessionId = null;
let currentChoices = [];
let streamingEnabled = false;
let selectedCampaign = null;  // { campaign_name, display_name, character_id }

/* ── Helpers ────────────────────────────────────────────────────── */
function _esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ── Load campaign list on page load ──────────────────────────── */
async function loadCampaigns() {
  const picker = document.getElementById('campaign-picker');
  try {
    const res = await fetch(API + '/campaigns');
    if (!res.ok) throw new Error('Failed to load campaigns');
    const campaigns = await res.json();

    let html = '';
    for (const c of campaigns) {
      html += `<div style="background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:1.1rem; margin-bottom:0.9rem;">`;
      html += `<div style="color:var(--accent); font-weight:bold; font-size:1.15rem;">${_esc(c.display_name)}</div>`;
      if (c.era_year) {
        html += `<div style="color:var(--text-dim); font-size:0.75rem;">${_esc(c.era)} · ${_esc(c.era_year)}</div>`;
      }

      // Story-architecture surface: dramatic premise, central question,
      // antagonistic force. Only shown for campaigns with story_architecture.
      if (c.dramatic_premise || c.central_dramatic_question || c.antagonistic_force) {
        html += `<details style="margin-top:0.7rem; cursor:pointer;">`;
        html += `<summary style="color:var(--text-dim); font-size:0.85rem; user-select:none;">What this story is about</summary>`;
        html += `<div style="margin-top:0.5rem; padding:0.6rem 0.8rem; background:var(--surface-alt); border-left:3px solid var(--accent); border-radius:0 4px 4px 0;">`;
        if (c.dramatic_premise) {
          html += `<div style="margin-bottom:0.5rem;"><span style="color:var(--text-dim); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em;">Premise</span><div style="font-size:0.88rem; line-height:1.4;">${_esc(c.dramatic_premise)}</div></div>`;
        }
        if (c.central_dramatic_question) {
          html += `<div style="margin-bottom:0.5rem;"><span style="color:var(--text-dim); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em;">Central question</span><div style="font-size:0.88rem; font-style:italic; line-height:1.4;">${_esc(c.central_dramatic_question)}</div></div>`;
        }
        if (c.antagonistic_force) {
          html += `<div><span style="color:var(--text-dim); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em;">The opposition</span><div style="font-size:0.88rem; line-height:1.4;">${_esc(c.antagonistic_force)}</div></div>`;
        }
        html += `</div></details>`;
      }

      html += `<div style="color:var(--text-dim); font-size:0.8rem; margin-top:0.6rem; font-style:italic;">${_esc(c.throughline)}</div>`;

      // Character cards with narrative_arc surface
      for (const ch of c.characters) {
        const safeId = _esc(ch.id);
        const arc = ch.narrative_arc || null;
        html += `<button onclick="selectCampaign('${_esc(c.campaign_name)}', '${_esc(c.display_name)}', '${safeId}')" `
          + `data-character-id="${safeId}" `
          + `style="display:block; width:100%; text-align:left; background:var(--surface-alt); border:1px solid var(--border); color:var(--text); padding:0.7rem 0.9rem; border-radius:4px; margin-top:0.5rem; cursor:pointer; font-family:inherit; font-size:0.9rem;">`
          + `<strong style="color:var(--accent);">${_esc(ch.name)}</strong>`
          + `<span style="color:var(--text-dim);"> — ${_esc(ch.species)} ${_esc(ch.career)}</span>`;
        if (ch.pitch) {
          html += `<div style="color:var(--text-dim); font-size:0.82rem; margin-top:0.3rem; line-height:1.4;">${_esc(ch.pitch)}</div>`;
        }
        // Surface lie / ghost / want / need so the player chooses with eyes open
        if (arc && (arc.lie || arc.ghost)) {
          html += `<div style="margin-top:0.55rem; padding-top:0.55rem; border-top:1px dashed var(--border); font-size:0.8rem;">`;
          if (arc.lie) {
            html += `<div style="margin-bottom:0.3rem;"><span style="color:var(--text-dim); font-size:0.7rem;">What they believe (wrongly):</span> <span style="color:var(--text); font-style:italic;">${_esc(arc.lie)}</span></div>`;
          }
          if (arc.ghost) {
            html += `<div style="margin-bottom:0.3rem;"><span style="color:var(--text-dim); font-size:0.7rem;">The wound behind it:</span> <span style="color:var(--text);">${_esc(arc.ghost)}</span></div>`;
          }
          if (arc.want) {
            html += `<div style="margin-bottom:0.3rem;"><span style="color:var(--text-dim); font-size:0.7rem;">What they want:</span> <span style="color:var(--text);">${_esc(arc.want)}</span></div>`;
          }
          if (arc.need) {
            html += `<div><span style="color:var(--text-dim); font-size:0.7rem;">What they need:</span> <span style="color:var(--text);">${_esc(arc.need)}</span></div>`;
          }
          html += `</div>`;
        }
        html += `</button>`;
      }
      html += `</div>`;
    }
    picker.innerHTML = html;
  } catch (e) {
    picker.innerHTML = `<p style="color:var(--danger);">Could not load campaigns: ${_esc(e.message)}</p>`;
  }
}

function selectCampaign(campaignName, displayName, characterId) {
  selectedCampaign = { campaign_name: campaignName, display_name: displayName, character_id: characterId };
  // Highlight selected
  document.querySelectorAll('#campaign-picker button').forEach(b => {
    b.style.borderColor = 'var(--border)';
  });
  event.currentTarget.style.borderColor = 'var(--accent)';
  // Enable start button
  const btn = document.getElementById('start-btn');
  btn.disabled = false;
  btn.textContent = 'Begin ' + displayName;
}

/* ── Start session ─────────────────────────────────────────────── */
async function startSession() {
  if (!selectedCampaign) return;
  const btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.textContent = 'Starting...';
  clearError();

  try {
    const res = await fetch(API + '/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        campaign_name: selectedCampaign.campaign_name,
        character_id: selectedCampaign.character_id,
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || 'Failed to create session');
    }

    const data = await res.json();
    sessionId = data.session_id;
    streamingEnabled = data.streaming_enabled || false;

    // Switch to game screen
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    document.getElementById('campaign-name').textContent = selectedCampaign.display_name;
    updateSessionInfo(0);

    // Render the "you are about to play..." session intro before turn 1.
    // The intro is GM-facing flavour the player commits to before the
    // opening narration begins; it carries forward into the prose contract.
    renderSessionIntro(data.session_intro);
    renderPassage(data.opening_narration);
    renderChoices(data.choices, data.choices_meta);
    showStatus(0, 0, 0);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Begin ' + selectedCampaign.display_name;
    showError(e.message);
  }
}

// Load campaigns on page load
document.addEventListener('DOMContentLoaded', loadCampaigns);

/* ── Take a turn ───────────────────────────────────────────────── */
async function takeTurn(choiceIndex, freeFormText) {
  if (streamingEnabled) {
    return takeTurnStream(choiceIndex, freeFormText);
  }
  disableChoices();
  if (choiceIndex >= 0) highlightChoice(choiceIndex);
  showLoading(true);
  clearError();
  hideDicePanel();

  try {
    const body = freeFormText
      ? { choice_index: -1, free_form_action: freeFormText }
      : { choice_index: choiceIndex };
    const res = await fetch(API + '/session/' + sessionId + '/turn', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || 'Turn failed');
    }

    const data = await res.json();

    renderPassage(data.narration);
    renderChoices(data.choices, data.choices_meta);

    // Phase 25 §2.8 / §3.3 — set-piece visual treatment + chapter title
    renderSceneTreatment(data.scene_treatment);
    renderChapterTitle(data.chapter_title);

    // Dice panel
    if (data.dice_result) {
      renderDicePanel(data.dice_result, data.roll_summary, data.destiny);
    }

    // Local narration warning
    const warn = document.getElementById('local-warning');
    if (data.used_local_narration) {
      warn.classList.add('visible');
    } else {
      warn.classList.remove('visible');
    }

    // Status bar
    if (data.session_state) {
      showStatus(
        data.session_state.turn_number,
        data.session_state.wounds,
        data.session_state.strain
      );
    }
  } catch (e) {
    showError(e.message);
    enableChoices();
  } finally {
    showLoading(false);
  }
}

/* ── Take a turn (streaming) ────────────────────────────────────── */
async function takeTurnStream(choiceIndex, freeFormText) {
  disableChoices();
  if (choiceIndex >= 0) highlightChoice(choiceIndex);
  showLoading(true);
  clearError();
  hideDicePanel();
  renderPendingChoices(freeFormText ? 'Acting on your words...' : 'Resolving your choice...');

  try {
    const body = freeFormText
      ? { choice_index: -1, free_form_action: freeFormText }
      : { choice_index: choiceIndex };
    const res = await fetch(API + '/session/' + sessionId + '/turn/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || 'Turn failed');
    }

    showLoading(false);
    const passageEl = document.getElementById('passage');
    passageEl.innerHTML = '';

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let passageText = '';
    let turnComplete = false;
    let startedStreaming = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // Parse complete SSE events (separated by \n\n)
      while (true) {
        const eventEnd = buffer.indexOf('\n\n');
        if (eventEnd === -1) break;

        const eventBlock = buffer.slice(0, eventEnd);
        buffer = buffer.slice(eventEnd + 2);

        let eventType = 'message';
        let eventData = '';

        for (const line of eventBlock.split('\n')) {
          if (line.startsWith('event: ')) {
            eventType = line.slice(7);
          } else if (line.startsWith('data: ')) {
            eventData += line.slice(6);
          }
        }

        if (!eventData) continue;

        let data;
        try { data = JSON.parse(eventData); } catch { continue; }

        if (eventType === 'done') {
          turnComplete = true;
          renderPassage(data.narration);
          renderChoices(data.choices, data.choices_meta);
          renderSceneTreatment(data.scene_treatment);
          renderChapterTitle(data.chapter_title);

          if (data.dice_result) {
            renderDicePanel(data.dice_result, data.roll_summary, data.destiny);
          }

          const warn = document.getElementById('local-warning');
          if (data.used_local_narration) warn.classList.add('visible');
          else warn.classList.remove('visible');

          if (data.session_state) {
            showStatus(
              data.session_state.turn_number,
              data.session_state.wounds,
              data.session_state.strain
            );
          }
        } else if (eventType === 'error') {
          throw new Error(data.error || 'Stream error');
        } else {
          // Text chunk — append to streamed passage
          if (!startedStreaming) {
            startedStreaming = true;
            renderPendingChoices('Finalizing next choices...');
          }
          passageText += data.text;
          renderStreamedPassage(passageText);
        }
      }
    }

    if (!turnComplete) {
      throw new Error('Stream ended without completion');
    }
  } catch (e) {
    showError(e.message);
    renderChoices(currentChoices, currentChoiceMeta);
    enableChoices();
    showLoading(false);
  }
}

/* ── Phase 25 §3.3 — chapter title rendering ─────────────────── */
function renderChapterTitle(chapter) {
  const el = document.getElementById('chapter-title');
  if (!el) return;
  if (!chapter || (!chapter.title && !chapter.act_number)) {
    el.style.display = 'none';
    return;
  }
  const title = chapter.title || '';
  const act = chapter.act_number ? `Part ${chapter.act_number}` : '';
  el.innerHTML = `${_esc(act)}${title ? ` · <strong>${_esc(title)}</strong>` : ''}`;
  el.style.display = 'block';
}

/* ── Phase 25 §2.8 — set-piece scene treatment ─────────────── */
function renderSceneTreatment(treatment) {
  const mount = document.getElementById('scene-treatment-mount');
  if (!mount) return;
  mount.innerHTML = '';
  if (!treatment) return;
  const variant = treatment.visual_treatment || 'scene_break';
  const sceneTitle = treatment.scene_title || '';
  const stakes = treatment.stakes_level || 'normal';
  let stakesBadge = '';
  if (stakes === 'high') stakesBadge = '<span class="stakes-badge high">CRITICAL MOMENT</span>';
  else if (stakes === 'critical') stakesBadge = '<span class="stakes-badge critical">CLIMAX</span>';

  if (variant === 'title_card') {
    mount.innerHTML = `<div class="scene-title-card">
      <div class="scene-title-label">SCENE</div>
      <div class="scene-title-text">${_esc(sceneTitle)} ${stakesBadge}</div>
    </div>`;
  } else if (variant === 'epigraph' && treatment.epigraph) {
    mount.innerHTML = `<div class="scene-epigraph">${_esc(treatment.epigraph)}</div>
      <div class="scene-break-marker"><span class="scene-title-text">${_esc(sceneTitle)} ${stakesBadge}</span></div>`;
  } else if (variant === 'scene_break') {
    mount.innerHTML = `<div class="scene-break-marker"><span class="scene-title-text">${_esc(sceneTitle)} ${stakesBadge}</span></div>`;
  } else if (stakes === 'high' || stakes === 'critical') {
    mount.innerHTML = `<div style="text-align:right; margin-bottom:0.4rem;">${stakesBadge}</div>`;
  }
}

/* ── Phase 25 §2.1 — codex overlay ────────────────────────────── */
async function openCodex(entryId) {
  if (!entryId || !sessionId) return;
  const overlay = document.getElementById('codex-overlay');
  const tagEl = document.getElementById('codex-entry-tag');
  const titleEl = document.getElementById('codex-entry-title');
  const bodyEl = document.getElementById('codex-entry-body');
  tagEl.textContent = '';
  titleEl.textContent = 'Loading...';
  bodyEl.innerHTML = '';
  overlay.classList.add('visible');
  try {
    const res = await fetch(API + '/session/' + sessionId + '/codex/' + encodeURIComponent(entryId));
    if (!res.ok) throw new Error('Codex entry unavailable');
    const data = await res.json();
    tagEl.textContent = data.tag || '';
    titleEl.textContent = data.title || '';
    bodyEl.innerHTML = renderProseMarkdown(data.body || '');
  } catch (e) {
    titleEl.textContent = 'Error';
    bodyEl.textContent = e.message;
  }
}

function closeCodex() {
  const overlay = document.getElementById('codex-overlay');
  overlay.classList.remove('visible');
}

function closeCodexIfBackdrop(event) {
  if (event.target.id === 'codex-overlay') closeCodex();
}

/* ── Phase 25 §3.5 — dashboard rendering ───────────────────── */
const DASHBOARD_TABS = [
  { key: 'hero',           label: 'Hero' },
  { key: 'personality',    label: 'Personality' },
  { key: 'relationships',  label: 'Bonds' },
  { key: 'skills',         label: 'Skills' },
  { key: 'talents',        label: 'Talents & Force' },
  { key: 'locks',          label: 'Beliefs' },
  { key: 'codex',          label: 'Codex' },
  { key: 'achievements',   label: 'Achievements' },
  { key: 'glossary',       label: 'Glossary' },
  { key: 'history',        label: 'Recent' },
];

let _dashboardState = { activeTab: 'hero', data: null };

async function openDashboard() {
  const overlay = document.getElementById('dashboard-overlay');
  overlay.classList.add('visible');
  try {
    const res = await fetch(API + '/session/' + sessionId + '/dashboard');
    if (!res.ok) throw new Error('Dashboard unavailable');
    const data = await res.json();
    _dashboardState.data = data;
    if (data.glossary) setGlossary(data.glossary);
    renderDashboardTabs();
    renderDashboardSection(_dashboardState.activeTab);
  } catch (e) {
    document.getElementById('dashboard-body').innerHTML =
      '<p style="color:var(--danger);">' + _esc(e.message) + '</p>';
  }
}

function closeDashboard() {
  document.getElementById('dashboard-overlay').classList.remove('visible');
}

function renderDashboardTabs() {
  const tabsEl = document.getElementById('dashboard-tabs');
  tabsEl.innerHTML = DASHBOARD_TABS.map(t =>
    '<button class="dashboard-tab-btn' +
    (_dashboardState.activeTab === t.key ? ' active' : '') +
    '" data-tab="' + t.key + '">' + _esc(t.label) + '</button>'
  ).join('');
  tabsEl.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      _dashboardState.activeTab = b.dataset.tab;
      renderDashboardTabs();
      renderDashboardSection(b.dataset.tab);
    };
  });
}

function renderDashboardSection(tabKey) {
  const body = document.getElementById('dashboard-body');
  const data = _dashboardState.data || {};
  let html = '<div class="dashboard-section active">';
  if (tabKey === 'hero')        html += renderHeroSection(data);
  else if (tabKey === 'personality')   html += renderPersonalitySection(data);
  else if (tabKey === 'relationships') html += renderRelationshipsSection(data);
  else if (tabKey === 'skills')        html += renderSkillsSection(data);
  else if (tabKey === 'talents')       html += renderTalentsSection(data);
  else if (tabKey === 'locks')         html += renderLocksSection(data);
  else if (tabKey === 'codex')         html += renderCodexListSection(data);
  else if (tabKey === 'achievements')  html += renderAchievementsSection(data);
  else if (tabKey === 'glossary')      html += renderGlossarySection(data);
  else if (tabKey === 'history')       html += renderHistorySection(data);
  html += '</div>';
  body.innerHTML = html;
  // Attach codex-list click handlers
  body.querySelectorAll('[data-codex-id]').forEach(el => {
    el.onclick = () => { closeDashboard(); openCodex(el.dataset.codexId); };
  });
}

function renderHeroSection(d) {
  const h = d.hero || {};
  const ch = d.chapter || {};
  let html = '<h3>Your Hero</h3>';
  html += '<div style="margin-bottom:0.8rem;">';
  html += '<div style="font-size:1.15rem; color:var(--accent); font-weight:bold;">' + _esc(h.name || '') + '</div>';
  html += '<div style="color:var(--text-dim); font-size:0.85rem;">' +
    _esc((h.species || '').replace('_', ' ').replace(/\b\w/g, c => c.toUpperCase())) + ' · ' +
    _esc((h.career || '').replace('_', ' ').replace(/\b\w/g, c => c.toUpperCase())) + '</div>';
  if ((h.specializations || []).length) {
    html += '<div style="color:var(--text-dim); font-size:0.8rem;">' +
      h.specializations.map(_esc).join(', ') + '</div>';
  }
  html += '</div>';
  if (h.background) {
    html += '<div style="font-size:0.85rem; color:var(--text); margin-bottom:0.8rem;">' +
      _esc(h.background) + '</div>';
  }
  if (h.voice_notes) {
    html += '<div style="font-style:italic; color:var(--text-dim); font-size:0.83rem; margin-bottom:0.8rem;">' +
      _esc(h.voice_notes) + '</div>';
  }
  // Health
  html += '<h3 style="margin-top:0.8rem;">Status</h3>';
  html += '<div style="font-family:monospace; font-size:0.85rem;">';
  html += 'Wounds: ' + (h.wounds && h.wounds.current) + '/' + (h.wounds && h.wounds.threshold) + '<br>';
  html += 'Strain: ' + (h.strain && h.strain.current) + '/' + (h.strain && h.strain.threshold) + '<br>';
  html += 'Soak: ' + (h.soak || 0);
  html += '</div>';
  if (ch && ch.title) {
    html += '<h3 style="margin-top:1rem;">Chapter</h3>';
    html += '<div style="font-size:0.9rem;">Part ' + (ch.act_number || 1) + ' · <strong>' +
      _esc(ch.title) + '</strong></div>';
    if (ch.tension) {
      html += '<div style="color:var(--text-dim); font-size:0.83rem; font-style:italic;">' +
        _esc(ch.tension) + '</div>';
    }
  }
  return html;
}

function renderPersonalitySection(d) {

/* ── Phase 25 §3.4 — light Markdown rendering for prose ──────── */
/* Supports:                                                       */
/*   *italic*  → <em>                                              */
/*   **bold**  → <strong>                                          */
/*   --- or * * * on a line → <hr class="scene-break">              */
function renderProseMarkdown(rawText) {
  // Process by paragraph (split on blank lines).
  const paragraphs = rawText.split(/\n\n+/).filter(p => p.trim());
  return paragraphs.map(p => {
    const trimmed = p.trim();
    // Standalone scene break markers
    if (/^(-{3,}|\*\s*\*\s*\*)$/.test(trimmed)) {
      return '<hr class="scene-break">';
    }
    // Escape HTML first, then add inline emphasis
    let html = escapeHtml(trimmed);
    // Bold (process before italic to avoid greedy ** matching as ***)
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Glossary-term highlights are applied by a later pass that
    // walks the rendered HTML and wraps known terms.
    return '<p>' + html + '</p>';
  }).join('');
}

/* Phase 25 §3.6 — apply glossary-term highlights to rendered prose */
let GLOSSARY_TERMS = [];   // [{term, short_definition, long_definition}]
let GLOSSARY_RE = null;

function setGlossary(entries) {
  GLOSSARY_TERMS = Array.isArray(entries) ? entries.slice() : [];
  // Sort longest first to avoid sub-string mis-matches.
  GLOSSARY_TERMS.sort((a, b) => (b.term || '').length - (a.term || '').length);
  if (!GLOSSARY_TERMS.length) {
    GLOSSARY_RE = null;
    return;
  }
  const escaped = GLOSSARY_TERMS.map(g =>
    (g.term || '').replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&')
  ).filter(Boolean);
  GLOSSARY_RE = new RegExp('\\b(' + escaped.join('|') + ')\\b', 'gi');
}

function applyGlossaryToHtml(html) {
  if (!GLOSSARY_RE) return html;
  // Don't decorate inside existing tags. Walk tag boundaries.
  let out = '';
  let inTag = false;
  let buf = '';
  for (const ch of html) {
    if (ch === '<') { out += decorateText(buf); buf = ''; inTag = true; out += ch; continue; }
    if (ch === '>') { inTag = false; out += ch; continue; }
    if (inTag) { out += ch; continue; }
    buf += ch;
  }
  out += decorateText(buf);
  return out;
}

function decorateText(text) {
  if (!GLOSSARY_RE || !text) return text;
  return text.replace(GLOSSARY_RE, (match) => {
    const entry = GLOSSARY_TERMS.find(g =>
      (g.term || '').toLowerCase() === match.toLowerCase()
    );
    if (!entry) return match;
    const tip = (entry.short_definition || '').replace(/"/g, '&quot;');
    return '<span class="glossary-term" title="' + tip + '">' + match + '</span>';
  });
}

/* ── Render prose ──────────────────────────────────────────────── */
function renderPassage(text) {
  const el = document.getElementById('passage');
  // Split into paragraphs on double newlines. Append after any
  // session-intro card already rendered so the intro stays visible
  // alongside the opening passage on turn 0.
  const existingHtml = el.innerHTML.trim();
  let passageHtml = renderProseMarkdown(text);
  passageHtml = applyGlossaryToHtml(passageHtml);
  if (existingHtml && existingHtml.includes('YOU ARE ABOUT TO PLAY')) {
    el.innerHTML = existingHtml + passageHtml;
  } else {
    el.innerHTML = passageHtml;
  }
  // Scroll to top of passage
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ── Render choices ────────────────────────────────────────────── */
let currentChoiceMeta = [];   // Phase 25 §2.1/§2.2 — per-choice metadata
function renderChoices(choices, meta) {
  const el = document.getElementById('choices');
  currentChoices = choices;
  currentChoiceMeta = Array.isArray(meta) ? meta : [];
  el.innerHTML = '';

  choices.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    const m = currentChoiceMeta[i] || {};
    // Phase 25 §2.1 — codex links open the codex overlay, do not advance turn
    if (m.kind === 'codex' || m.codex_link) {
      btn.classList.add('codex-link');
      btn.textContent = text;
      btn.onclick = () => openCodex(m.codex_link);
      el.appendChild(btn);
      return;
    }
    // Phase 25 §2.2 — render visible cost tags inline. The tag text is
    // already in the choice text (parser kept it), but we also stylize
    // any remaining bracketed cost so the player can scan it quickly.
    btn.innerHTML = renderChoiceText(text, m.visible_costs);
    btn.onclick = () => takeTurn(i);
    el.appendChild(btn);
  });

  // Free-form input affordance — let the player type their own action.
  const ffWrapper = document.createElement('div');
  ffWrapper.className = 'freeform-wrapper';
  ffWrapper.innerHTML = ''
    + '<details class="freeform-details">'
    + '  <summary>Speak or act in your own words</summary>'
    + '  <div class="freeform-row">'
    + '    <textarea id="freeform-input" rows="2" maxlength="600" '
    + '      placeholder="Describe what your character does or says..."></textarea>'
    + '    <button id="freeform-submit" class="choice-btn freeform-submit">Act</button>'
    + '  </div>'
    + '  <div class="freeform-hint">'
    + '    The system will pick an appropriate skill and difficulty for what you describe. '
    + '    Press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to send.'
    + '  </div>'
    + '</details>';
  el.appendChild(ffWrapper);

  const ffInput = document.getElementById('freeform-input');
  const ffSubmit = document.getElementById('freeform-submit');
  const submitFreeform = () => {
    const text = (ffInput.value || '').trim();
    if (!text) return;
    takeTurn(-1, text);
  };
  ffSubmit.onclick = submitFreeform;
  ffInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      submitFreeform();
    }
  });
}

function renderPendingChoices(message) {
  const el = document.getElementById('choices');
  el.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'choice-btn';
  btn.disabled = true;
  btn.textContent = message;
  el.appendChild(btn);
}

/* Phase 25 §2.2 — render a choice line with cost tags styled.
   The choice text already has cost tags inline like "[Strain: +2]";
   we apply small color treatments so the player can scan them. */
function renderChoiceText(text, costs) {
  let html = escapeHtml(text);
  html = html.replace(/\[([^\[\]]+?)\]/g, (full, inner) => {
    const lower = inner.toLowerCase();
    let cls = 'choice-cost-tag';
    if (lower.startsWith('morality:') || lower.startsWith('conflict:') ||
        lower.startsWith('obligation:')) {
      // Negative shifts get a danger color
      const m = inner.match(/:\s*([+\-]?-?\d+)/);
      if (m && parseInt(m[1], 10) < 0 && lower.startsWith('morality:')) {
        cls += ' morality-down';
      }
    }
    return '<span class="' + cls + '">[' + escapeHtml(inner) + ']</span>';
  });
  return html;
}

  document.querySelectorAll('.choice-btn').forEach(b => { b.disabled = true; });

function enableChoices() {
  document.querySelectorAll('.choice-btn').forEach(b => { b.disabled = false; });

  let html = '<div class="dice-pool-display">';

    diceResult.dice.forEach(d => {
      for (let i = 0; i < d.count; i++) {
        html += '<span class="die-chip ' + d.color + '">'
          + d.type.charAt(0).toUpperCase() + '</span>';
      }
    });
  }
  html += '</div>';

  // Pool description
  html += '<div style="color:var(--text-dim);margin-bottom:0.5rem">'
    + escapeHtml(diceResult.description) + '</div>';

  // Roll summary + destiny indicator
  if (rollSummary) {
    html += '<div class="roll-summary">' + escapeHtml(rollSummary);
    if (destiny && destiny.light_spent) {
      html += '<span class="destiny-indicator light" title="The Force was with you — Light Destiny upgraded the pool.">★ Destiny (Light)</span>';

      html += '<span class="destiny-indicator dark" title="The galaxy pushed back — Dark Destiny upgraded the difficulty.">★ Destiny (Dark)</span>';

    html += '</div>';
  }

  details.innerHTML = html;
}

/* ── Utilities ─────────────────────────────────────────────────── */
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/* ── Session resume (check URL or localStorage) ────────────────── */
(function init() {
  const params = new URLSearchParams(window.location.search);
  const sid = params.get('session');
  if (sid) {
    resumeSession(sid);
  }
})();

async function resumeSession(sid) {
  clearError();
  try {
    const res = await fetch(API + '/session/' + sid);
    if (!res.ok) return; // no session, show start screen

    const data = await res.json();
    sessionId = data.session_id;
    streamingEnabled = data.streaming_enabled || false;

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    document.getElementById('campaign-name').textContent =
      data.campaign_name || 'Campaign';
    updateSessionInfo(data.turn_count);

    if (data.last_turn) {
      renderPassage(data.last_turn.narration);
      renderChoices(data.last_turn.choices, data.last_turn.choices_meta);
      // Phase 25 §3.7 — recap card on resume
      if (data.recap) renderRecapCard(data.recap);

      if (data.last_turn.roll_result) {
        // Minimal dice display from session restore
        const panel = document.getElementById('dice-panel');
        const details = document.getElementById('dice-details');
        panel.classList.add('visible');
        const label = data.last_turn.roll_result.narrative_label ||
          data.last_turn.check_skill || '';
        details.innerHTML = '<div class="roll-summary">'
          + escapeHtml(label) + '</div>';
      }
    }

    if (data.session_state) {
      showStatus(
        data.turn_count,
        data.session_state.wounds,
        data.session_state.strain
      );
    }
  } catch (e) {
    // silently fall back to start screen
  }
}
</script>
